name: Build Musical Scraper

# PyInstaller cannot cross-compile: the Windows .exe must be built on Windows and
# the macOS .app on macOS. That is the whole reason this workflow exists.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (.app)
          - os: windows-latest
            label: Windows (.exe)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Build
        run: pyinstaller --noconfirm --clean MusicalScraper.spec

      # ditto, not zip: it preserves the bundle's symlinks, permissions and the
      # ad-hoc signature. A plain zip produces an .app that won't launch.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --keepParent "Musical Scraper.app" "MusicalScraper-macOS.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd dist
          7z a MusicalScraper-Windows.zip MusicalScraper.exe

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: python -c "import musical_scraper; print('import OK', len(musical_scraper.DEFAULTS), 'options')"

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          test -x "dist/Musical Scraper.app/Contents/MacOS/Musical Scraper"
          codesign --verify --deep --strict "dist/Musical Scraper.app"
          python -c "import musical_scraper; print('import OK', len(musical_scraper.DEFAULTS), 'options')"

      - uses: actions/upload-artifact@v4
        with:
          name: MusicalScraper-${{ runner.os }}
          path: dist/MusicalScraper-*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
